name: Schedule Bot for Week

# Fires Wednesday night UTC, the day BEFORE the reminders go out. The
# endpoint it calls uses Slack's chat.scheduleMessage to queue all four
# Thursday reminders at the exact London times (09:00, 12:00, 15:00,
# 16:00) — Slack delivers them precisely.
#
# Why Wednesday night and not Thursday 06:00? GitHub Actions runs scheduled
# workflows on a best-effort basis and routinely delays them by hours under
# load. A Thursday-06:00 cron was firing as late as 10:16 UTC (11:16 London),
# by which point the 09:00 first-call slot was already in the past and Slack
# rejected it with `time_in_past`. Firing at 22:00 UTC Wednesday leaves a
# ~10-hour buffer, so even a multi-hour delay still lands well before 09:00
# London. nextThursdayLondon() correctly targets the upcoming Thursday.
#
# `workflow_dispatch` lets you run the workflow manually from the GitHub
# Actions tab — useful for testing or recovering from a failed run. Re-runs
# are idempotent: the endpoint clears the existing batch before re-queuing.
on:
  schedule:
    - cron: "0 22 * * 3"
  workflow_dispatch:

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger schedule-week
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$APP_BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::APP_BASE_URL and CRON_SECRET must both be set as repo secrets"
            exit 1
          fi
          response=$(
            curl -fsSL -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -w "\nHTTP %{http_code}\n" \
              "$APP_BASE_URL/api/cron/schedule-week"
          )
          echo "$response"
